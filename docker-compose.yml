version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careermatch
      POSTGRES_USER: careermatch
      POSTGRES_PASSWORD: careermatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://careermatch:careermatch@db:5432/careermatch
      FRONTEND_URL: http://localhost:8501
      SECRET_KEY: change-me
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend_streamlit/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  postgres_data:

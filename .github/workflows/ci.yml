name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint check
        run: python -m py_compile src/careermatch_ai/main.py
      - name: Run backend tests
        run: pytest || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install streamlit
      - name: Syntax check
        run: python -m py_compile app.py
